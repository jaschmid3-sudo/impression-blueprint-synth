<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Hour Impression Blueprint + Web Audio Synthesizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .step-led {
            transition: all 0.08s ease-in-out;
        }

        .step-led.active {
            background-color: #3fb950;
            box-shadow: 0 0 12px #3fb950;
            transform: scale(1.15);
        }

        .step-led.accent {
            border-color: #58a6ff;
        }

        input[type=range] {
            -webkit-appearance: none;
            background: #21262d;
            border-radius: 6px;
            height: 6px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.5);
        }
    </style>
</head>

                Synthesized Web Audio Engine featuring Bo Diddley Beats & Slap Bass
            </p>
        </header>

        <!-- Audio Synthesizer Control Panel -->

                <div class="flex items-center gap-3">
                    <button id="playBtn" class="bg-[#3fb950] hover:bg-[#2ea043] text-black font-bold px-6 py-3 rounded-lg flex items-center gap-2 transition duration-150 transform active:scale-95 shadow-lg select-none cursor-pointer">

                        <span class="pointer-events-none">Play Groove</span>

                        <svg class="w-5 h-5 fill-current pointer-events-none" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>
                        <span class="pointer-events-none">Stop</span>
                    </button>
                </div>
                
                <div class="text-right">
                    <div id="statusText" class="text-sm font-semibold text-[#d29922]">Engine Ready</div>

                </div>
            </div>

                        <span id="bpmValue" class="text-[#58a6ff] font-mono font-bold">105</span>
                    </div>
                    <input type="range" id="bpmSlider" min="70" max="150" value="105" class="w-full">
