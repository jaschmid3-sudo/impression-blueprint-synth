<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Hour Impression Blueprint + Web Audio Synthesizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
        }

        .step-led {
            transition: all 0.1s ease-in-out;
        }

        .step-led.active {
            background-color: #3fb950;
            box-shadow: 0 0 12px #3fb950;
            transform: scale(1.15);
        }

        .step-led.accent {
            border-color: #58a6ff;
        }

        /* Custom Range Input Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: #21262d;
            border-radius: 6px;
            height: 6px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 18px;
            width: 18px;
            border-radius: 50%;
            background: #58a6ff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(88, 166, 255, 0.5);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex justify-center items-center">

    <div class="max-w-4xl w-full space-y-6">
        
        <!-- Header -->
        <header class="text-center py-6 border-b border-[#30363d]">
            <h1 class="text-3xl md:text-4xl font-extrabold text-[#58a6ff] tracking-tight mb-2">
                1-Hour Impression Blueprint & Audio Synth
            </h1>
            <p class="text-[#8b949e] text-sm md:text-base">
                Synthesized Web Audio Engine featuring Bo Diddley Beats & Slap Bass
            </p>
        </header>

        <!-- Audio Synthesizer Control Panel -->
        <div class="bg-[#161b22] border border-[#30363d] rounded-xl p-6 shadow-2xl space-y-6">
            
            <!-- Main Controls Header -->
