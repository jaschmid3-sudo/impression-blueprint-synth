<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-Hour Impression Blueprint + Blues Bass & Drum Track</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --accent-orange: #d29922;
            --text-main: #c9d1d9;
            --text-bright: #ffffff;
            --border-color: #30363d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        h1 {
            color: var(--accent-blue);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #8b949e;
        }

        .audio-controls {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin-bottom: 30px;
        }

        .btn {
            background-color: var(--accent-green);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            padding: 12px 28px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-stop {
            background-color: #f85149;
            color: #fff;
            margin-left: 10px;
        }

        .status {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--accent-orange);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
        }

        .card h2 {
            color: var(--accent-blue);
            font-size: 1.2rem;
            margin-top: 0;
        }

        ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        li {
            margin-bottom: 8px;
        }

            border: 1px solid var(--border-color
